<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAFFRON — Manager Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #d4a017;
    --orange: #ff6b35;
    --deep: #070506;
    --card: #0f0c08;
    --card2: #161109;
    --border: rgba(212,160,23,0.15);
    --text: #f0e6d3;
    --muted: #7a6a54;
    --green: #2ecc71;
    --red: #e74c3c;
    --blue: #3498db;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--deep);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    cursor: none;
  }

  /* CURSOR */
  .cursor { width: 10px; height: 10px; background: var(--gold); border-radius: 50%; position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999; transform: translate(-50%,-50%); mix-blend-mode: difference; transition: 0.08s; }
  .cursor-ring { width: 30px; height: 30px; border: 1.5px solid rgba(212,160,23,0.6); border-radius: 50%; position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9998; transform: translate(-50%,-50%); transition: 0.16s ease; }

  /* NOISE */
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 9997; opacity: 0.25;
  }

  /* SIDEBAR */
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; width: 72px;
    background: var(--card); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 0; gap: 8px; z-index: 100;
  }
  .sidebar-logo {
    font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 2px;
    background: linear-gradient(135deg, var(--gold), var(--orange));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    writing-mode: vertical-rl; transform: rotate(180deg);
    margin-bottom: 32px; font-weight: 700;
  }
  .sidebar-icon {
    width: 44px; height: 44px; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; cursor: none; transition: all 0.2s;
    color: var(--muted);
  }
  .sidebar-icon:hover, .sidebar-icon.active { border-color: var(--gold); color: var(--gold); background: rgba(212,160,23,0.06); }
  .sidebar-bottom { margin-top: auto; }
  .logout-btn {
    width: 44px; height: 44px; border: 1px solid rgba(231,76,60,0.3);
    background: none; display: flex; align-items: center; justify-content: center;
    font-size: 1rem; cursor: none; color: #e74c3c; transition: all 0.2s;
  }
  .logout-btn:hover { background: rgba(231,76,60,0.1); border-color: var(--red); }

  /* MAIN */
  .main { margin-left: 72px; min-height: 100vh; padding: 0; }

  /* TOPBAR */
  .topbar {
    padding: 20px 40px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(7,5,6,0.95); backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 50;
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .topbar-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; }
  .topbar-title span { font-size: 0.7rem; letter-spacing: 3px; color: var(--muted); display: block; font-family: 'Rajdhani', sans-serif; font-weight: 400; text-transform: uppercase; }
  .live-badge {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 14px; border: 1px solid rgba(46,204,113,0.3);
    background: rgba(46,204,113,0.06); font-size: 0.7rem; letter-spacing: 2px;
    text-transform: uppercase; color: var(--green);
  }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.4;transform:scale(0.7);} }
  .topbar-right { display: flex; align-items: center; gap: 20px; }
  .stat-chip {
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 18px; border: 1px solid var(--border); background: var(--card);
    min-width: 80px;
  }
  .stat-chip-val { font-size: 1.4rem; font-weight: 700; background: linear-gradient(135deg, var(--gold), var(--orange)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .stat-chip-label { font-size: 0.6rem; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }

  /* FILTERS */
  .filters-row {
    padding: 20px 40px; display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  .filter-tab {
    padding: 8px 20px; background: none; border: 1px solid var(--border);
    color: var(--muted); font-family: 'Rajdhani', sans-serif;
    font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase;
    font-weight: 600; cursor: none; transition: all 0.2s;
  }
  .filter-tab.active { border-color: var(--gold); color: var(--gold); background: rgba(212,160,23,0.08); }
  .filter-tab:hover { border-color: var(--gold); color: var(--gold); }
  .filter-tab .tab-count {
    margin-left: 6px; background: var(--gold); color: var(--deep);
    padding: 1px 6px; font-size: 0.65rem; border-radius: 20px;
    font-weight: 700;
  }
  .filter-tab.active .tab-count { background: var(--orange); }

  /* ORDERS GRID */
  .orders-area { padding: 32px 40px; }
  .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 24px; }
  .empty-state {
    grid-column: 1 / -1; text-align: center; padding: 80px 20px;
    color: var(--muted);
  }
  .empty-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.3; }
  .empty-text { font-size: 1rem; letter-spacing: 2px; }

  /* ORDER CARD */
  .order-card {
    background: var(--card2); border: 1px solid var(--border);
    overflow: hidden; transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
    animation: cardIn 0.4s cubic-bezier(0.16,1,0.3,1);
    position: relative;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .order-card:hover { border-color: rgba(212,160,23,0.35); box-shadow: 0 8px 40px rgba(0,0,0,0.4); }
  .order-card.status-pending { border-left: 3px solid var(--gold); }
  .order-card.status-preparing { border-left: 3px solid var(--orange); }
  .order-card.status-ready { border-left: 3px solid var(--green); }
  .order-card.status-served { border-left: 3px solid var(--muted); opacity: 0.65; }

  .card-head {
    padding: 18px 20px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; gap: 12px;
  }
  .order-num-badge {
    background: rgba(212,160,23,0.1); border: 1px solid rgba(212,160,23,0.3);
    padding: 6px 12px; font-family: 'Cinzel', serif;
    font-size: 0.78rem; letter-spacing: 1px; color: var(--gold);
    white-space: nowrap;
  }
  .order-meta { flex: 1; }
  .cust-name { font-size: 1rem; font-weight: 700; margin-bottom: 3px; }
  .cust-details { font-size: 0.75rem; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .cust-detail-item { display: flex; align-items: center; gap: 4px; }
  .order-time { font-size: 0.68rem; color: var(--muted); letter-spacing: 1px; white-space: nowrap; }
  .status-pill {
    padding: 4px 12px; font-size: 0.65rem; letter-spacing: 2px;
    text-transform: uppercase; font-weight: 700; border-radius: 0;
  }
  .pill-pending { background: rgba(212,160,23,0.15); color: var(--gold); }
  .pill-preparing { background: rgba(255,107,53,0.15); color: var(--orange); }
  .pill-ready { background: rgba(46,204,113,0.15); color: var(--green); }
  .pill-served { background: rgba(140,122,98,0.15); color: var(--muted); }

  /* ITEMS LIST */
  .items-list { padding: 14px 20px; border-bottom: 1px solid var(--border); }
  .order-item-row {
    display: flex; align-items: center; gap: 10px; padding: 7px 0;
    border-bottom: 1px solid rgba(212,160,23,0.06);
  }
  .order-item-row:last-child { border-bottom: none; }
  .item-thumb { width: 42px; height: 42px; object-fit: cover; flex-shrink: 0; }
  .item-info { flex: 1; }
  .item-name-mgr { font-size: 0.88rem; font-weight: 600; }
  .item-cat-mgr { font-size: 0.65rem; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .item-qty-badge {
    background: rgba(212,160,23,0.1); border: 1px solid rgba(212,160,23,0.25);
    padding: 3px 9px; font-size: 0.75rem; color: var(--gold); font-weight: 700;
    white-space: nowrap;
  }
  .item-price-mgr { font-size: 0.82rem; color: var(--muted); white-space: nowrap; }
  .special-note {
    margin-top: 8px; padding: 8px 10px;
    background: rgba(255,107,53,0.06); border-left: 2px solid var(--orange);
    font-size: 0.75rem; color: var(--orange); line-height: 1.4;
  }

  /* ORDER FOOTER */
  .order-card-foot { padding: 16px 20px; }
  .total-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
  }
  .total-label { font-size: 0.7rem; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .total-val {
    font-size: 1.2rem; font-weight: 700;
    background: linear-gradient(135deg, var(--gold), var(--orange));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .actions-row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ETA SETTER */
  .eta-group { display: flex; gap: 6px; align-items: center; flex: 1; }
  .eta-input {
    width: 64px; padding: 8px 10px; background: rgba(255,255,255,0.04);
    border: 1px solid var(--border); color: var(--text);
    font-family: 'Rajdhani', sans-serif; font-size: 0.9rem; outline: none;
    transition: border-color 0.2s; text-align: center;
  }
  .eta-input:focus { border-color: var(--gold); }
  .eta-unit { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
  .eta-presets { display: flex; gap: 4px; }
  .eta-preset {
    padding: 7px 10px; background: none; border: 1px solid var(--border);
    color: var(--muted); font-family: 'Rajdhani', sans-serif;
    font-size: 0.7rem; cursor: none; transition: all 0.2s; font-weight: 600;
  }
  .eta-preset:hover { border-color: var(--gold); color: var(--gold); background: rgba(212,160,23,0.06); }

  .action-btn {
    padding: 9px 16px; font-family: 'Rajdhani', sans-serif;
    font-size: 0.72rem; letter-spacing: 1.5px; text-transform: uppercase;
    font-weight: 700; border: 1.5px solid; cursor: none; transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-prepare { border-color: var(--orange); color: var(--orange); background: none; }
  .btn-prepare:hover { background: var(--orange); color: var(--deep); }
  .btn-ready { border-color: var(--green); color: var(--green); background: none; }
  .btn-ready:hover { background: var(--green); color: var(--deep); }
  .btn-served { border-color: var(--muted); color: var(--muted); background: none; }
  .btn-served:hover { background: var(--muted); color: var(--deep); }
  .btn-set-eta { border-color: var(--gold); color: var(--gold); background: none; }
  .btn-set-eta:hover { background: var(--gold); color: var(--deep); }

  .eta-display {
    margin-top: 10px; padding: 7px 12px;
    background: rgba(212,160,23,0.06); border: 1px solid rgba(212,160,23,0.2);
    font-size: 0.75rem; color: var(--gold); display: none;
    align-items: center; gap: 6px; letter-spacing: 1px;
  }
  .eta-display.show { display: flex; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--card2); border: 1px solid var(--border);
    padding: 12px 28px; font-size: 0.82rem; letter-spacing: 1px;
    z-index: 9000; transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
    color: var(--gold); box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* SCROLL */
  ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: rgba(212,160,23,0.3); }

  @media(max-width:768px){
    .sidebar { display: none; }
    .main { margin-left: 0; }
    .topbar, .filters-row, .orders-area { padding-left: 16px; padding-right: 16px; }
    .orders-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-logo">SAFFRON</div>
  <div class="sidebar-icon active" title="Orders">📋</div>
  <div class="sidebar-icon" title="Menu" onclick="window.location.href='index.html'">🍽️</div>
  <div class="sidebar-bottom">
    <button class="logout-btn" title="Logout" onclick="window.location.href='index.html'">⬅</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-title">
        Manager Dashboard
        <span>Real-time Kitchen Control</span>
      </div>
      <div class="live-badge">
        <div class="live-dot"></div>
        Live
      </div>
    </div>
    <div class="topbar-right">
      <div class="stat-chip">
        <div class="stat-chip-val" id="statTotal">0</div>
        <div class="stat-chip-label">Total Orders</div>
      </div>
      <div class="stat-chip">
        <div class="stat-chip-val" id="statPending">0</div>
        <div class="stat-chip-label">Pending</div>
      </div>
      <div class="stat-chip">
        <div class="stat-chip-val" id="statRevenue">₹0</div>
        <div class="stat-chip-label">Revenue</div>
      </div>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="filters-row">
    <button class="filter-tab active" data-filter="all" onclick="setFilter('all',this)">
      All <span class="tab-count" id="cnt-all">0</span>
    </button>
    <button class="filter-tab" data-filter="pending" onclick="setFilter('pending',this)">
      Pending <span class="tab-count" id="cnt-pending">0</span>
    </button>
    <button class="filter-tab" data-filter="preparing" onclick="setFilter('preparing',this)">
      Preparing <span class="tab-count" id="cnt-preparing">0</span>
    </button>
    <button class="filter-tab" data-filter="ready" onclick="setFilter('ready',this)">
      Ready <span class="tab-count" id="cnt-ready">0</span>
    </button>
    <button class="filter-tab" data-filter="served" onclick="setFilter('served',this)">
      Served <span class="tab-count" id="cnt-served">0</span>
    </button>
  </div>

  <!-- ORDERS -->
  <div class="orders-area">
    <div class="orders-grid" id="ordersGrid">
      <div class="empty-state">
        <div class="empty-icon">🔄</div>
        <div class="empty-text">Loading orders...</div>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB5lK3edUOatl-NWKoylSgk46XP7NyoJUs",
  authDomain: "food-c7abc.firebaseapp.com",
  databaseURL: "https://food-c7abc-default-rtdb.firebaseio.com",
  projectId: "food-c7abc",
  storageBucket: "food-c7abc.firebasestorage.app",
  messagingSenderId: "556941373763",
  appId: "1:556941373763:web:4bcdfcb397f8d8f3017ff6",
  measurementId: "G-E02X9Z7W9E"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allOrders = [];
let currentFilter = 'all';

// ─── REAL-TIME LISTENER ──────────────────────────────────
const q = query(collection(db, 'orders'), orderBy('createdAt', 'desc'));
onSnapshot(q, (snapshot) => {
  allOrders = snapshot.docs.map(d => ({ _id: d.id, ...d.data() }));
  renderOrders();
  updateStats();
});

// ─── RENDER ──────────────────────────────────────────────
function renderOrders() {
  const grid = document.getElementById('ordersGrid');
  let filtered = currentFilter === 'all' ? allOrders : allOrders.filter(o => o.status === currentFilter);

  // Update counts
  ['all','pending','preparing','ready','served'].forEach(s => {
    const cnt = s === 'all' ? allOrders.length : allOrders.filter(o => o.status === s).length;
    const el = document.getElementById('cnt-' + s);
    if (el) el.textContent = cnt;
  });

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">No ${currentFilter === 'all' ? '' : currentFilter + ' '}orders</div></div>`;
    return;
  }

  grid.innerHTML = filtered.map(order => renderOrderCard(order)).join('');
}

function formatTime(ts) {
  if (!ts) return 'Just now';
  const date = ts.toDate ? ts.toDate() : new Date(ts);
  return date.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
}

function renderOrderCard(order) {
  const statusPills = { pending: 'pill-pending', preparing: 'pill-preparing', ready: 'pill-ready', served: 'pill-served' };
  const statusLabels = { pending: '⏳ Pending', preparing: '🔥 Preparing', ready: '✅ Ready', served: '🍽 Served' };
  const items = order.items || [];
  const total = order.totalAmount || 0;

  const itemsHTML = items.map(item => `
    <div class="order-item-row">
      <img class="item-thumb" src="${item.img || 'https://images.unsplash.com/photo-1567529692333-de9fd6772897?w=100&q=60'}" alt="${item.name}" onerror="this.style.display='none'">
      <div class="item-info">
        <div class="item-name-mgr">${item.name}</div>
        <div class="item-cat-mgr">${item.cat}</div>
      </div>
      <div class="item-qty-badge">× ${item.qty}</div>
      <div class="item-price-mgr">₹${(item.price * item.qty)}</div>
    </div>
  `).join('');

  const specialHTML = order.specialInstructions ? `<div class="special-note">📝 ${order.specialInstructions}</div>` : '';

  const etaDisplayHTML = order.estimatedTime
    ? `<div class="eta-display show" id="etaDisplay-${order._id}">⏱ ETA set: <strong>${order.estimatedTime} minutes</strong> — customer notified</div>`
    : `<div class="eta-display" id="etaDisplay-${order._id}"></div>`;

  // Action buttons based on status
  let actionBtns = '';
  if (order.status === 'pending') {
    actionBtns = `<button class="action-btn btn-prepare" onclick="updateStatus('${order._id}','preparing')">🔥 Start Preparing</button>`;
  } else if (order.status === 'preparing') {
    actionBtns = `<button class="action-btn btn-ready" onclick="updateStatus('${order._id}','ready')">✅ Mark Ready</button>`;
  } else if (order.status === 'ready') {
    actionBtns = `<button class="action-btn btn-served" onclick="updateStatus('${order._id}','served')">🍽 Mark Served</button>`;
  }

  return `
    <div class="order-card status-${order.status}" id="card-${order._id}">
      <div class="card-head">
        <div class="order-num-badge">${order.orderNumber || order._id.slice(-6).toUpperCase()}</div>
        <div class="order-meta">
          <div class="cust-name">${order.customerName || 'Guest'}</div>
          <div class="cust-details">
            <span class="cust-detail-item">🪑 Table ${order.tableNumber}</span>
            <span class="cust-detail-item">📱 ${order.mobileNumber}</span>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          <span class="status-pill ${statusPills[order.status] || 'pill-pending'}">${statusLabels[order.status] || order.status}</span>
          <span class="order-time">${formatTime(order.createdAt)}</span>
        </div>
      </div>

      <div class="items-list">
        ${itemsHTML}
        ${specialHTML}
      </div>

      <div class="order-card-foot">
        <div class="total-row">
          <span class="total-label">Order Total</span>
          <span class="total-val">₹${total}</span>
        </div>

        <!-- ETA SETTER -->
        <div style="margin-bottom:10px">
          <div style="font-size:0.68rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:8px">Set Preparation Time</div>
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
            <div class="eta-presets">
              <button class="eta-preset" onclick="setPreset('${order._id}',10)">10m</button>
              <button class="eta-preset" onclick="setPreset('${order._id}',20)">20m</button>
              <button class="eta-preset" onclick="setPreset('${order._id}',30)">30m</button>
              <button class="eta-preset" onclick="setPreset('${order._id}',45)">45m</button>
            </div>
            <input class="eta-input" id="etaInput-${order._id}" type="number" min="1" max="120" placeholder="min" value="${order.estimatedTime || ''}">
            <span class="eta-unit">mins</span>
            <button class="action-btn btn-set-eta" onclick="saveETA('${order._id}')">Set ETA</button>
          </div>
          ${etaDisplayHTML}
        </div>

        <!-- STATUS ACTIONS -->
        ${order.status !== 'served' ? `<div class="actions-row">${actionBtns}</div>` : '<div style="color:var(--muted);font-size:0.75rem;letter-spacing:2px;text-transform:uppercase;text-align:center;padding:8px">Order Completed ✓</div>'}
      </div>
    </div>
  `;
}

// ─── UPDATE STATUS ────────────────────────────────────────
window.updateStatus = async function(orderId, newStatus) {
  try {
    await updateDoc(doc(db, 'orders', orderId), { status: newStatus });
    showToast(`Order status updated: ${newStatus.toUpperCase()}`);
  } catch(e) { showToast('Error: ' + e.message); }
};

// ─── SET ETA ──────────────────────────────────────────────
window.setPreset = function(orderId, mins) {
  const input = document.getElementById('etaInput-' + orderId);
  if (input) input.value = mins;
};

window.saveETA = async function(orderId) {
  const input = document.getElementById('etaInput-' + orderId);
  const val = parseInt(input?.value);
  if (!val || val < 1) { showToast('Enter a valid time in minutes'); return; }
  try {
    await updateDoc(doc(db, 'orders', orderId), { estimatedTime: val, status: 'preparing' });
    const display = document.getElementById('etaDisplay-' + orderId);
    if (display) {
      display.innerHTML = `⏱ ETA set: <strong>${val} minutes</strong> — customer notified`;
      display.classList.add('show');
    }
    showToast(`⏱ ETA set to ${val} minutes — customer screen updated!`);
  } catch(e) { showToast('Error: ' + e.message); }
};

// ─── FILTER ───────────────────────────────────────────────
window.setFilter = function(filter, el) {
  currentFilter = filter;
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderOrders();
};

// ─── STATS ────────────────────────────────────────────────
function updateStats() {
  document.getElementById('statTotal').textContent = allOrders.length;
  document.getElementById('statPending').textContent = allOrders.filter(o => o.status === 'pending' || o.status === 'preparing').length;
  const rev = allOrders.filter(o => o.status === 'served').reduce((s, o) => s + (o.totalAmount || 0), 0);
  document.getElementById('statRevenue').textContent = '₹' + rev;
}

// ─── TOAST ───────────────────────────────────────────────
window.showToast = function(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
};
</script>

<script>
// CURSOR
const cursor = document.getElementById('cursor');
const ring = document.getElementById('cursorRing');
document.addEventListener('mousemove', e => {
  cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px';
  setTimeout(() => { ring.style.left = e.clientX + 'px'; ring.style.top = e.clientY + 'px'; }, 60);
});
</script>
</body>
</html>
